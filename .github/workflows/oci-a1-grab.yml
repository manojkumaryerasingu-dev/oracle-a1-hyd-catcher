name: OCI A1 Instance Auto Grab

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-a1-grab
  cancel-in-progress: false

jobs:
  grab-a1-instance:
    runs-on: ubuntu-latest

    env:
      OCI_CLI_VENV: ${{ github.workspace }}/.cache/oci-cli-venv
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ap-hyderabad-1

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache OCI CLI environment
        id: oci-cli-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OCI_CLI_VENV }}
          key: oci-cli-venv-${{ runner.os }}-${{ runner.arch }}-py3.11-v1

      - name: Cache pip packages
        if: steps.oci-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-oci-cli-${{ runner.os }}-${{ runner.arch }}-py3.11-v1

      - name: Install OCI CLI
        if: steps.oci-cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv --copies "$OCI_CLI_VENV"
          "$OCI_CLI_VENV/bin/pip" install --upgrade pip oci-cli

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          echo "$OCI_CLI_VENV/bin" >> "$GITHUB_PATH"
          command -v jq
          "$OCI_CLI_VENV/bin/oci" --version

      - name: Configure OCI CLI
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            OCI_CLI_USER
            OCI_CLI_TENANCY
            OCI_CLI_FINGERPRINT
            OCI_CLI_KEY_CONTENT
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: GitHub secret $var is missing or empty."
              exit 1
            fi
          done

          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_CLI_KEY_CONTENT" | tr -d '\r' > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          # No leading spaces (heredoc indent breaks OCI config)
          {
            echo "[DEFAULT]"
            echo "user=${OCI_CLI_USER}"
            echo "fingerprint=${OCI_CLI_FINGERPRINT}"
            echo "tenancy=${OCI_CLI_TENANCY}"
            echo "region=${OCI_CLI_REGION}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
          } > "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"

          echo "OCI CLI configuration written for region ${OCI_CLI_REGION}."
          oci --no-retry iam region list --output table >/dev/null
          echo "OCI auth smoke test OK."

      - name: Catch A1 capacity
        shell: bash
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          set +e
          set -u

          TARGET_SHAPE="VM.Standard.A1.Flex"
          TARGET_OCPUS=2
          TARGET_MEMORY=8

          echo "=== OCI A1 capacity catcher ==="
          echo "Region: ${OCI_CLI_REGION}"
          echo "Availability Domain: ${OCI_AVAILABILITY_DOMAIN}"
          echo "Target: ${TARGET_SHAPE} / ${TARGET_OCPUS} OCPU / ${TARGET_MEMORY} GB"

          required_vars=(
            OCI_COMPARTMENT_ID
            OCI_SUBNET_ID
            OCI_AVAILABILITY_DOMAIN
            OCI_IMAGE_ID
            OCI_SSH_PUBLIC_KEY
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: GitHub secret $var is missing or empty."
              exit 1
            fi
          done

          SSH_KEY_FILE="$RUNNER_TEMP/oci-authorized_keys"
          printf '%s\n' "$OCI_SSH_PUBLIC_KEY" | tr -d '\r' > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"

          is_retryable_capacity_error() {
            local text="$1"

            if printf '%s\n' "$text" | grep -Eiq \
              'Out of host capacity|Out of capacity for shape|TooManyRequests|Too Many Requests|User[- ]rate limit|HTTP[[:space:]]*429'; then
              return 0
            fi

            if printf '%s\n' "$text" | grep -Eiq 'InternalError' &&
               printf '%s\n' "$text" | grep -Eiq 'capacity|no host capacity'; then
              return 0
            fi

            return 1
          }

          print_oci_error() {
            local text="$1"
            echo "----- OCI response -----"
            printf '%s\n' "$text"
            echo "------------------------"
          }

          # ----------------------------------------------------------
          # 1. Existing A1 guard (compartment-wide, no AD filter)
          # ----------------------------------------------------------

          echo "=== Checking for an existing non-terminated A1 ==="

          LIST_ERR_FILE=$(mktemp)
          LIST_RESULT=$(oci --no-retry compute instance list \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --all \
            --output json 2>"$LIST_ERR_FILE")
          LIST_RC=$?
          LIST_ERR=$(cat "$LIST_ERR_FILE")
          rm -f "$LIST_ERR_FILE"

          if [ "$LIST_RC" -ne 0 ]; then
            echo "ERROR: OCI instance-list failed (exit ${LIST_RC})."
            echo "This is not treated as a capacity retry."
            echo "----- stderr -----"
            printf '%s\n' "$LIST_ERR"
            echo "----- stdout -----"
            printf '%s\n' "$LIST_RESULT"
            echo "------------------------"
            exit 1
          fi

          EXISTING_INSTANCES=$(printf '%s\n' "$LIST_RESULT" | jq -c \
            --arg shape "$TARGET_SHAPE" '
              [
                (.data // [])[]
                | select(.shape == $shape)
                | select((."lifecycle-state" // "") != "TERMINATED")
                | {
                    id: .id,
                    state: (."lifecycle-state" // "UNKNOWN"),
                    shape: (.shape // "UNKNOWN"),
                    ocpus: (."shape-config".ocpus // 0),
                    memory: (."shape-config"."memory-in-gbs" // 0),
                    ad: (."availability-domain" // "UNKNOWN")
                  }
              ]
            ' 2>&1)
          JQ_RC=$?

          if [ "$JQ_RC" -ne 0 ]; then
            echo "ERROR: Could not parse OCI instance-list JSON."
            echo "----- jq error -----"
            printf '%s\n' "$EXISTING_INSTANCES"
            echo "----- raw stdout -----"
            printf '%s\n' "$LIST_RESULT"
            echo "----- stderr -----"
            printf '%s\n' "$LIST_ERR"
            echo "------------------------"
            exit 1
          fi

          EXISTING_COUNT=$(printf '%s\n' "$EXISTING_INSTANCES" | jq 'length')

          if [ "$EXISTING_COUNT" -gt 0 ]; then
            echo "Found ${EXISTING_COUNT} non-terminated A1 instance(s)."
            printf '%s\n' "$EXISTING_INSTANCES" | jq -r '
              .[] |
              "ID: \(.id)\nState: \(.state)\nShape: \(.shape)\nOCPU: \(.ocpus)\nMemory: \(.memory) GB\nAD: \(.ad)\n---"
            '
            echo "SAFE STOP: an A1 already exists. No second launch."
            exit 0
          fi

          echo "No non-terminated A1 exists. Attempting direct 2 OCPU / 8 GB launch."

          # ----------------------------------------------------------
          # 2. Direct launch (AD required here)
          # ----------------------------------------------------------

          CREATE_ERR_FILE=$(mktemp)
          CREATE_RESULT=$(oci --no-retry compute instance launch \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --availability-domain "$OCI_AVAILABILITY_DOMAIN" \
            --shape "$TARGET_SHAPE" \
            --shape-config "{\"ocpus\": ${TARGET_OCPUS}, \"memoryInGBs\": ${TARGET_MEMORY}}" \
            --image-id "$OCI_IMAGE_ID" \
            --subnet-id "$OCI_SUBNET_ID" \
            --assign-public-ip true \
            --ssh-authorized-keys-file "$SSH_KEY_FILE" \
            --display-name "A1-Auto-Grabbed" \
            --output json 2>"$CREATE_ERR_FILE")
          CREATE_RC=$?
          CREATE_ERR=$(cat "$CREATE_ERR_FILE")
          rm -f "$CREATE_ERR_FILE"

          if [ "$CREATE_RC" -ne 0 ]; then
            echo "A1 launch failed (exit ${CREATE_RC})."
            COMBINED="${CREATE_ERR}
${CREATE_RESULT}"
            print_oci_error "$COMBINED"

            if is_retryable_capacity_error "$COMBINED"; then
              echo "TEMPORARY CAPACITY/THROTTLING ERROR."
              echo "Next scheduled run will retry."
              exit 0
            fi

            echo "NON-RETRYABLE OCI ERROR."
            echo "Fix credentials, AD, subnet, image, permissions, or quota."
            exit 1
          fi

          INSTANCE_ID=$(printf '%s\n' "$CREATE_RESULT" | jq -r '.data.id // empty')

          if [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: Launch returned success but no instance OCID."
            print_oci_error "$CREATE_RESULT"
            exit 1
          fi

          echo "Launch accepted."
          echo "Instance OCID: ${INSTANCE_ID}"
          echo "Future runs will see this non-terminated instance and will not duplicate."

          # ----------------------------------------------------------
          # 3. Verify configuration (best-effort)
          # ----------------------------------------------------------

          VERIFIED=false

          for i in $(seq 1 20); do
            VERIFY_RESULT=$(oci --no-retry compute instance get \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null)
            VERIFY_RC=$?

            if [ "$VERIFY_RC" -eq 0 ]; then
              ACTUAL_STATE=$(printf '%s\n' "$VERIFY_RESULT" | jq -r '.data."lifecycle-state" // "UNKNOWN"')
              ACTUAL_SHAPE=$(printf '%s\n' "$VERIFY_RESULT" | jq -r '.data.shape // "UNKNOWN"')
              ACTUAL_OCPUS=$(printf '%s\n' "$VERIFY_RESULT" | jq -r '.data."shape-config".ocpus // 0')
              ACTUAL_MEMORY=$(printf '%s\n' "$VERIFY_RESULT" | jq -r '.data."shape-config"."memory-in-gbs" // 0')
              ACTUAL_AD=$(printf '%s\n' "$VERIFY_RESULT" | jq -r '.data."availability-domain" // "UNKNOWN"')

              echo "Verification ${i}/20:"
              echo "  State: ${ACTUAL_STATE}"
              echo "  Shape: ${ACTUAL_SHAPE}"
              echo "  OCPU: ${ACTUAL_OCPUS}"
              echo "  Memory: ${ACTUAL_MEMORY} GB"
              echo "  AD: ${ACTUAL_AD}"

              if [ "$ACTUAL_SHAPE" = "$TARGET_SHAPE" ] && \
                 awk "BEGIN { exit !($ACTUAL_OCPUS >= $TARGET_OCPUS && $ACTUAL_MEMORY >= $TARGET_MEMORY) }"; then
                VERIFIED=true
                break
              fi

              if [ "$ACTUAL_STATE" = "TERMINATING" ] || [ "$ACTUAL_STATE" = "TERMINATED" ]; then
                echo "ERROR: Newly created A1 entered a terminal state."
                exit 1
              fi
            else
              echo "Verification ${i}/20: get not ready yet."
            fi

            sleep 15
          done

          if [ "$VERIFIED" = true ]; then
            echo "SUCCESS: A1 verified at or above 2 OCPU / 8 GB."
            echo "Disable this workflow after confirming the instance in OCI Console."
            exit 0
          fi

          echo "Launch accepted but verify window ended."
          echo "IMPORTANT: Instance ${INSTANCE_ID} already exists — do not create another."
          echo "Next scheduled run will detect it and stop."
          exit 0
